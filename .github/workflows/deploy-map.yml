name: Deploy architecture map

# Publishes site/ to S3 and clears the CDN. Terraform owns the bucket and the
# distribution; this owns what is inside the bucket. That split keeps a wording
# change on the map from needing credentials that could delete the distribution.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

# Never two deploys at once, and don't cancel one midway — a half-finished
# sync leaves the bucket inconsistent.
concurrency:
  group: deploy-map
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write # required for the OIDC exchange

    env:
      CACHE_CONTROL: public, max-age=60, s-maxage=300

    steps:
      - uses: actions/checkout@v6

      # The map reaches here through a PR, but a direct push to main doesn't,
      # so validate before publishing rather than after.
      - name: Validate the map
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check_architecture.py

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish
        run: |
          aws s3 sync site/ "s3://${{ vars.MAP_BUCKET }}/" \
            --delete \
            --cache-control "$CACHE_CONTROL"

          # The CLI guesses content types from the extension and gets .yaml
          # wrong, which makes the browser download it instead of the page
          # reading it. Re-put that one object with the type set.
          aws s3 cp site/architecture.yaml "s3://${{ vars.MAP_BUCKET }}/architecture.yaml" \
            --content-type "application/yaml" \
            --cache-control "$CACHE_CONTROL" \
            --metadata-directive REPLACE

      # Without this the edge keeps serving the previous page for up to
      # s-maxage. /* counts as a single path, and the first 1,000 a month
      # are free.
      - name: Invalidate the CDN
        id: invalidate
        run: |
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "${{ vars.MAP_DISTRIBUTION_ID }}" \
                 --paths "/*" \
                 --query 'Invalidation.Id' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Invalidation $id created."

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Deploy"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo ":rocket: Published to \`${{ vars.MAP_BUCKET }}\` and invalidated \`${{ steps.invalidate.outputs.id }}\`."
              echo
              echo "<https://architecture.tobypeel.com>"
            else
              echo ":x: Deploy failed — the live map is unchanged."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
