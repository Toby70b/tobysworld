name: Update architecture map

# Claude updates site/architecture.yaml against a repo whose Terraform changed,
# the scripts mirror it into the page and validate it, and the result is raised
# as a PR. Claude never commits — the mechanical steps are deterministic.
#
# Triggered either by hand, or by a repository_dispatch from a source repo.
# See templates/notify-architecture-map.yml for the sending half.
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Repository whose Terraform changed (owner/name)
        required: true
        default: Toby70b/does-it-have-fall-damage
  repository_dispatch:
    types: [infra-changed]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One run per source repo. A second push while a run is in flight
    # supersedes it rather than racing it onto the same branch.
    concurrency:
      group: update-map-${{ inputs.source_repo || github.event.client_payload.repo }}
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    env:
      # workflow_dispatch supplies an input; repository_dispatch a payload.
      SOURCE_REPO: ${{ inputs.source_repo || github.event.client_payload.repo }}

    steps:
      - name: Check the trigger named a repository
        run: |
          if [ -z "$SOURCE_REPO" ]; then
            echo "::error::no source repository — a dispatch must send client_payload.repo"
            exit 1
          fi
          echo "Reconciling the map against $SOURCE_REPO"

      - name: Check out the map
        uses: actions/checkout@v6

      - name: Check out the repository that changed
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: _source
          fetch-depth: 1

      # owner/name is not usable in a branch name as-is.
      - name: Name the branch after the source repo
        id: meta
        run: echo "slug=$(echo "$SOURCE_REPO" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Update the YAML
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Edit is not granted by default, so without this Claude reads
          # everything and changes nothing. No Bash: the prompt has no need.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Edit,Write"
          prompt: |
            Read architecture-map-brief.md first. It has the schema, the scope
            rules, the conventions and the list of things to leave off the map.

            The repository whose Terraform changed is checked out at ./_source.
            Read its Terraform and its Lambda source, and update
            site/architecture.yaml so the map matches what is actually declared
            there.

            The map covers several repositories. Resources belonging to the
            others are not in ./_source and must be left alone — only reconcile
            the parts of the map that this repository owns.

            Edit only site/architecture.yaml. Do not run the scripts in
            scripts/, do not commit, do not push — a later step handles that.

            If nothing on the map needs to change, leave the file untouched and
            say so rather than inventing an edit.

            Finish by listing every edge you inferred from IAM policies or
            application code rather than read directly from a Terraform
            resource, since those are the ones I need to check.

      # Claude's own words, reused as the PR description and the run summary.
      - name: Collect Claude's report
        if: always()
        run: |
          OUT=/home/runner/work/_temp/claude-execution-output.json
          {
            echo "Raised automatically from a change in [\`$SOURCE_REPO\`](https://github.com/$SOURCE_REPO)."
            echo
            echo "---"
            echo
            if [ -f "$OUT" ]; then
              jq -r '[.. | objects | select(.type? == "result") | .result?]
                     | map(select(. != null)) | last // "No result recorded."' "$OUT" \
                || echo "_Could not parse the execution log._"
            else
              echo "_No execution log written._"
            fi
          } > "$RUNNER_TEMP/claude-report.md"

      # Deterministic, so they are scripts rather than something Claude does.
      # check_architecture.py exits non-zero, which fails the job before a PR
      # can be raised on a broken map.
      - name: Mirror into the page and validate
        if: steps.claude.outcome == 'success'
        run: |
          python -m pip install --quiet pyyaml
          python scripts/sync_page.py
          python scripts/check_architecture.py

      # add-paths matters: the workspace also holds _source, and without it
      # the whole checked-out source repo would land in the commit.
      - name: Raise a pull request
        if: steps.claude.outcome == 'success'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/arch-map/${{ steps.meta.outputs.slug }}
          delete-branch: true
          add-paths: |
            site/architecture.yaml
            site/cloud-architecture.html
          title: Update the architecture map from ${{ env.SOURCE_REPO }}
          commit-message: Update the architecture map from ${{ env.SOURCE_REPO }}
          body-path: ${{ runner.temp }}/claude-report.md

      # Renders on the run's summary page. The point is to tell "Claude looked
      # and agreed" apart from "Claude never ran" — an unchanged file alone
      # cannot distinguish the two.
      - name: Report what Claude decided
        if: always()
        run: |
          REPORT=$(mktemp)
          {
            echo "## Architecture map vs \`$SOURCE_REPO\`"
            echo

            if [ "${{ steps.claude.outcome }}" != "success" ]; then
              echo "### :x: Claude did not complete"
              echo
              echo "The map was **not** checked. Treat an unchanged file as meaningless here."
            elif [ -n "${{ steps.pr.outputs.pull-request-number }}" ]; then
              echo "### :pencil2: Map updated"
              echo
              echo "PR [#${{ steps.pr.outputs.pull-request-number }}](${{ steps.pr.outputs.pull-request-url }}) was ${{ steps.pr.outputs.pull-request-operation }}."
            else
              echo "### :white_check_mark: No change needed"
              echo
              echo "Claude read the Terraform and left the map as it is, so no PR was raised."
            fi

            echo
            echo "### What Claude reported"
            echo
            cat "$RUNNER_TEMP/claude-report.md" 2>/dev/null || echo "_No report._"
          } > "$REPORT"

          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
