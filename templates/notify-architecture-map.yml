# Copy this into any repo whose infrastructure should appear on the map, at
# .github/workflows/notify-architecture-map.yml. Nothing in it is specific to
# a given repo, so it can go in unchanged.
#
# One prerequisite per repo: a secret named MAP_DISPATCH_TOKEN holding a
# fine-grained PAT with Contents: read-and-write on Toby70b/tobysworld ONLY.
# The built-in GITHUB_TOKEN cannot trigger a workflow in another repository,
# which is the whole reason this token exists.
#
#   gh secret set MAP_DISPATCH_TOKEN --repo Toby70b/<this-repo>
#
# Past three or four repos, swap the PAT for a GitHub App installed on all of
# them — one credential to rotate instead of N. An App token is a bot actor,
# so the receiving workflow would then need `allowed_bots` set.

name: Notify architecture map

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
  # Worth keeping: lets you re-trigger without pushing anything.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    # No permissions needed in THIS repo — the PAT carries the rights that
    # matter, and they apply to the map repo rather than this one.
    permissions: {}

    steps:
      # Most Terraform pushes do not change the architecture: formatting,
      # comments, variable descriptions. Checking first avoids spending model
      # quota on a diff the map cannot possibly care about.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Did the Terraform change substantively?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Triggered by hand, notifying regardless."
            exit 0
          fi

          before="${{ github.event.before }}"
          case "$before" in
            0000000*) echo "changed=true" >> "$GITHUB_OUTPUT"
                      echo "No previous commit to compare; notifying."
                      exit 0 ;;
          esac

          # Any added or removed line that is not blank and not a comment.
          # Matching only resource/module/data is too narrow: renaming a
          # variable can change which service a Lambda talks to, and that
          # moves a node on the map. This still skips pure reformatting and
          # comment-only edits, which was the point.
          if git diff "$before" "${{ github.sha }}" -- '*.tf' \
               | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
               | sed 's/#.*$//' | grep -qE '[^+[:space:]-]'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Terraform changed substantively."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only formatting or comments changed."
          fi

      - name: Tell the map
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MAP_DISPATCH_TOKEN }}
          repository: Toby70b/tobysworld
          event-type: infra-changed
          # Keep this small. The map repo checks this repo out itself rather
          # than being sent a diff.
          client-payload: |
            {"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}
